<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cube Grab & Pressure Pads Demo</title>
  <style>
    body, html {
      margin: 0; padding: 0; overflow: hidden;
      font-family: sans-serif;
      background: #000;
      color: white;
      user-select: none;
    }
    #startScreen {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #003300cc;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      cursor: pointer;
      z-index: 10;
    }
    canvas { display: block; }
  </style>
</head>
<body>

<div id="startScreen">START GAME</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

// Globals
let scene, camera, renderer, world;

// Player setup
const player = {
  velocity: new THREE.Vector3(),
  direction: new THREE.Vector3(),
  yaw: 0,
  pitch: 0,
  speed: 10,
  height: 1.6,
  position: new THREE.Vector3(0, 1.6, 4),
};

// Init Three + Cannon
function init() {
  // Scene & Camera
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.copy(player.position);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x111111);
  document.body.appendChild(renderer.domElement);

  // Physics world
  world = new CANNON.World({
    gravity: new CANNON.Vec3(0, -9.82, 0),
  });

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  // Floor
  const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x444444 });
  const floorGeo = new THREE.BoxGeometry(20, 0.1, 20);
  const floorMesh = new THREE.Mesh(floorGeo, floorMaterial);
  floorMesh.position.set(0, 0, 0);
  floorMesh.receiveShadow = true;
  scene.add(floorMesh);

  // Cannon floor body
  const floorBody = new CANNON.Body({
    mass: 0,
    shape: new CANNON.Box(new CANNON.Vec3(10, 0.05, 10)),
  });
  floorBody.position.copy(floorMesh.position);
  world.addBody(floorBody);
function makeMathWall(problemText, position) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#222'; // not pure black
ctx.fillRect(0, 0, 512, 256);
ctx.fillStyle = '#fff'; // white text
  ctx.font = 'bold 50px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(problemText, 256, 128);

  const texture = new THREE.CanvasTexture(canvas);
  const mat = new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide });
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), mat);
  wall.position.copy(position);
  wall.rotation.y = position.z !== 0 ? 0 : Math.PI / 2;
  scene.add(wall);
}
function makePad(x, z) {
  const pad = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.05, 2),
    new THREE.MeshStandardMaterial({ color: 0x00ff00 })
  );
    pad.position.set(x, 0.3, z);
;
  pad.receiveShadow = true;
  scene.add(pad);
}
function makeAnswerCube(text, x, z) {
  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color: 0xff0000 })
  );
  cube.position.set(x, 0.5, z);
  cube.castShadow = true;

  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 80px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 128);
  const labelTexture = new THREE.CanvasTexture(canvas);

  const labelMat = new THREE.MeshBasicMaterial({ map: labelTexture });
  const cubeWithText = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    [labelMat, labelMat, labelMat, labelMat, labelMat, labelMat]
  );
  cubeWithText.position.copy(cube.position);
  cubeWithText.castShadow = true;
  scene.add(cubeWithText);
}
makeMathWall("12 + 7 = ?", new THREE.Vector3(0, 1.5, -9.9));
makePad(0, -7);
makeAnswerCube("19", 2, -5);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  world.step(1 / 60, delta);
  player.velocity.x -= player.velocity.x * 8 * delta;
player.velocity.z -= player.velocity.z * 8 * delta;

const speed = player.speed;
if (moveForward) player.velocity.z -= speed * delta;
if (moveBackward) player.velocity.z += speed * delta;
if (moveLeft) player.velocity.x -= speed * delta;
if (moveRight) player.velocity.x += speed * delta;

const dir = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0, 1, 0));

player.position.addScaledVector(dir, player.velocity.z * delta);
player.position.addScaledVector(right, player.velocity.x * delta);

camera.position.copy(player.position);
camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

  renderer.render(scene, camera);
}
animate();
}
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

document.addEventListener('keydown', e => {
  if (e.code === 'KeyW') moveForward = true;
  if (e.code === 'KeyS') moveBackward = true;
  if (e.code === 'KeyA') moveLeft = true;
  if (e.code === 'KeyD') moveRight = true;
});
document.addEventListener('keyup', e => {
  if (e.code === 'KeyW') moveForward = false;
  if (e.code === 'KeyS') moveBackward = false;
  if (e.code === 'KeyA') moveLeft = false;
  if (e.code === 'KeyD') moveRight = false;
});
document.body.onclick = () => document.body.requestPointerLock();

document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === document.body) {
    player.yaw -= e.movementX * 0.002;
    player.pitch -= e.movementY * 0.002;
    player.pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, player.pitch));
  }
});

document.addEventListener('mousedown', onMouseDown);

function onMouseDown(e) {
  if (document.pointerLockElement !== document.body) return;

  const mouse = new THREE.Vector2(0, 0); // Center of screen
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(scene.children, true);
  for (let i = 0; i < intersects.length; i++) {
    const mesh = intersects[i].object;
    if (mesh.userData.isGrabbable) {
      grabCube(mesh);
      break;
    }
  }
}

document.getElementById('startScreen').onclick = () => {
  document.getElementById('startScreen').style.display = 'none';
  init();
};


</script>
</body>
</html>
